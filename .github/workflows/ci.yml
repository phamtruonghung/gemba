name: test and publish the image

# The test job is the gate; the image job only runs when the tests pass, and it pushes to
# ghcr.io on main (and on a version tag) so another machine can deploy with a pull instead of a
# build. On a pull request the image is built and run once, because "it builds" is not "it works".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the code claims (node:sqlite arrives in 22.13) and whatever 22 is today.
        node: ['22.13.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - name: Unit and end-to-end tests (node:test, no dependencies)
        run: node --test test/*.test.mjs
      - name: Retrieval eval (offline, fails the build below eval/baseline.json)
        run: npm run eval

  ui:
    # The design system is only as good as the check that runs on it. This job measures the pages
    # in a real browser (overflow at phone and desktop widths, contrast, focus, tap targets, the
    # painted button), so a token cannot quietly drift into an unreadable palette.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Interface checks in a headless browser
        env:
          SHOT_DIR: ${{ runner.temp }}/ui-shots
        run: python scripts/ui-check.py
      - name: Contrast measured from the pixels, not from the stylesheet
        # A style-based check can resolve the wrong background inside a dark band. This reads the
        # screenshots the previous step took and fails if the text on a band is not legible.
        run: python scripts/measure-contrast.py "${{ runner.temp }}"/ui-shots/*-light.png
      - name: Upload the screenshots when something is wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ${{ runner.temp }}/ui-shots

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the built image and ask it a question
        if: github.event_name == 'pull_request'
        run: |
          set -e
          docker run -d --name gemba-smoke -p 8090:8090 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/healthz; then ok=1; break; fi
            sleep 2
          done
          test "${ok:-}" = 1 || { echo "the container never became healthy"; docker logs gemba-smoke; exit 1; }
          echo "--- ask through the container:"
          curl -fsS -X POST http://127.0.0.1:8090/api/ask \
            -H 'content-type: application/json' \
            -d '{"question":"the machine stops mid-shift — what should I check, and in what order?"}'
          echo
          echo "--- container log:"
          docker logs gemba-smoke
          docker rm -f gemba-smoke
