name: test and publish the image

# The test job is the gate; the image job only runs when the tests pass, and it pushes to
# ghcr.io on main (and on a version tag) so another machine can deploy with a pull instead of a
# build. On a pull request the image is built and run once, because "it builds" is not "it works".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version
      - name: Unit and end-to-end tests (node:test, no dependencies)
        run: node --test test/*.test.mjs

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the built image and ask it a question
        if: github.event_name == 'pull_request'
        run: |
          set -e
          docker run -d --name xuong-smoke -p 8090:8090 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/healthz; then ok=1; break; fi
            sleep 2
          done
          test "${ok:-}" = 1 || { echo "the container never became healthy"; docker logs xuong-smoke; exit 1; }
          echo "--- ask through the container:"
          curl -fsS -X POST http://127.0.0.1:8090/api/ask \
            -H 'content-type: application/json' \
            -d '{"question":"the machine stops mid-shift — what should I check, and in what order?"}'
          echo
          echo "--- container log:"
          docker logs xuong-smoke
          docker rm -f xuong-smoke
